<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Fishdoku</title>
  </head>
  <body>
    <div id="app">
      <button type="button" id="help-btn" aria-label="How to play">? How to play</button>
      <header id="fishdoku-header"></header>
      <main id="fishdoku-main">
        <div id="board-container">
          <div id="board" role="grid" aria-label="Fishdoku board"></div>
        </div>
        <div id="controls">
          <button type="button" id="prev-day" aria-label="Previous day">&lsaquo;</button>
          <button type="button" id="clear-btn" aria-label="Clear board">Clear</button>
          <button type="button" id="next-day" aria-label="Next day">&rsaquo;</button>
        </div>
      </main>
      <div id="win-overlay" class="win-hidden" role="dialog" aria-label="You won!"></div>
      <div id="help-overlay" class="win-hidden" role="dialog" aria-modal="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
